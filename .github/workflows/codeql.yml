<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenwell-AI Developer Hub</title>
    <!-- Tailwind CSS for robust, modern utility-first styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for beautiful analytics and performance visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Font Awesome for sleek developer icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }

        .code-font {
            font-family: 'Fira Code', monospace;
        }

        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1rem;
        }

        .glow-accent-green {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .glow-accent-blue {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        /* Custom Scrollbar for Playground and code elements */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(11, 15, 25, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.5);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between">

    <!-- Navigation Bar -->
    <nav class="sticky top-0 z-50 glass-panel mx-4 my-3 px-6 py-4 flex justify-between items-center shadow-lg border-b border-gray-800">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-emerald-500 to-teal-400 p-2.5 rounded-lg text-gray-950 flex items-center justify-center shadow-md">
                <i class="fa-solid fa-microchip text-lg"></i>
            </div>
            <div>
                <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">KENWELL-AI</span>
                <span class="text-xs block text-gray-400 font-mono">v1.4.2-LTS</span>
            </div>
        </div>
        
        <div class="hidden md:flex space-x-2 text-sm font-medium">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="px-4 py-2 rounded-lg bg-gray-800 text-emerald-400 border border-emerald-500/20 transition-all">
                <i class="fa-solid fa-chart-line mr-2"></i>Dashboard
            </button>
            <button onclick="switchTab('playground')" id="nav-playground" class="px-4 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all">
                <i class="fa-solid fa-terminal mr-2"></i>Playground
            </button>
            <button onclick="switchTab('keys')" id="nav-keys" class="px-4 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all">
                <i class="fa-solid fa-key mr-2"></i>Token Security
            </button>
            <button onclick="switchTab('docs')" id="nav-docs" class="px-4 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all">
                <i class="fa-solid fa-book mr-2"></i>API Reference
            </button>
        </div>

        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2 bg-emerald-950/40 border border-emerald-800/30 px-3 py-1.5 rounded-full">
                <span class="h-2.5 w-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-xs text-emerald-400 font-medium font-mono">Operational</span>
            </div>
        </div>
    </nav>

    <!-- Custom Toast Notification Box -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-10 opacity-0 transition-all duration-300 flex items-center p-4 space-x-3 max-w-sm rounded-lg shadow-xl text-white bg-gray-900 border border-emerald-500/30">
        <div class="bg-emerald-500/10 p-2 rounded-md text-emerald-400">
            <i id="toast-icon" class="fa-solid fa-circle-check"></i>
        </div>
        <div>
            <p id="toast-message" class="text-sm font-medium">Action completed successfully.</p>
        </div>
    </div>

    <!-- Main Workspace Container -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-6">

        <!-- VIEW: DASHBOARD -->
        <section id="view-dashboard" class="tab-view space-y-8">
            <!-- Hero Introduction -->
            <div class="glass-panel p-8 relative overflow-hidden">
                <div class="absolute -right-16 -top-16 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -left-16 -bottom-16 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
                
                <div class="max-w-3xl">
                    <span class="text-xs font-mono uppercase tracking-widest text-emerald-400 font-semibold bg-emerald-950/60 px-2.5 py-1 rounded-md border border-emerald-500/20">Official Kenwell Enterprise Architecture</span>
                    <h1 class="text-3xl md:text-5xl mt-4 mb-4 font-bold tracking-tight text-white leading-tight">
                        Powering Autonomous Token Security & Real-Time AI Inference
                    </h1>
                    <p class="text-gray-400 leading-relaxed text-base md:text-lg">
                        Welcome to the official **Kenwell-AI Library** console. Connect seamlessly to localized language models, monitor token lifecycle dynamics, program advanced routing systems, and configure secure authentication blueprints.
                    </p>
                    <div class="flex flex-wrap gap-4 mt-6">
                        <button onclick="switchTab('playground')" class="px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-500 text-gray-950 font-bold rounded-lg hover:from-emerald-400 hover:to-teal-400 transition-all flex items-center space-x-2 shadow-md">
                            <span>Open Local Playground</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                        <button onclick="switchTab('docs')" class="px-5 py-2.5 bg-gray-800 text-white font-medium rounded-lg hover:bg-gray-700 transition-all flex items-center space-x-2 border border-gray-700">
                            <i class="fa-solid fa-file-code"></i>
                            <span>Browse Quick Start Docs</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Stats grid -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="glass-panel p-5 flex flex-col justify-between">
                    <span class="text-xs text-gray-400 font-mono uppercase tracking-wider">Active Instances</span>
                    <div class="flex items-baseline space-x-2 mt-2">
                        <span class="text-3xl font-extrabold text-white">4</span>
                        <span class="text-xs text-emerald-400 font-mono font-medium"><i class="fa-solid fa-arrow-up mr-1"></i>100%</span>
                    </div>
                    <span class="text-[10px] text-gray-500 mt-2 block">Docker containers online</span>
                </div>
                <div class="glass-panel p-5 flex flex-col justify-between">
                    <span class="text-xs text-gray-400 font-mono uppercase tracking-wider">Total Inferences</span>
                    <div class="flex items-baseline space-x-2 mt-2">
                        <span class="text-3xl font-extrabold text-white">142.8k</span>
                        <span class="text-xs text-emerald-400 font-mono font-medium"><i class="fa-solid fa-arrow-up mr-1"></i>12%</span>
                    </div>
                    <span class="text-[10px] text-gray-500 mt-2 block">Requests over last 24h</span>
                </div>
                <div class="glass-panel p-5 flex flex-col justify-between">
                    <span class="text-xs text-gray-400 font-mono uppercase tracking-wider">Key Security Status</span>
                    <div class="flex items-baseline space-x-2 mt-2">
                        <span class="text-3xl font-extrabold text-white text-teal-400 font-mono">ENCRYPTED</span>
                    </div>
                    <span class="text-[10px] text-teal-500/80 mt-2 block">AES-256 HSM Secured</span>
                </div>
                <div class="glass-panel p-5 flex flex-col justify-between">
                    <span class="text-xs text-gray-400 font-mono uppercase tracking-wider">Avg Response Latency</span>
                    <div class="flex items-baseline space-x-2 mt-2">
                        <span class="text-3xl font-extrabold text-white">18.4ms</span>
                        <span class="text-xs text-emerald-400 font-mono font-medium"><i class="fa-solid fa-bolt mr-1"></i>Perfect</span>
                    </div>
                    <span class="text-[10px] text-gray-500 mt-2 block">In-memory Redis caching</span>
                </div>
            </div>

            <!-- Visualizations and Metrics -->
            <div class="grid lg:grid-cols-3 gap-6">
                <!-- Main Request Chart -->
                <div class="glass-panel p-6 lg:col-span-2">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h3 class="font-bold text-lg text-white">Real-Time Traffic Analytics</h3>
                            <p class="text-xs text-gray-400">Comparing library inference cycles vs routing overhead</p>
                        </div>
                        <div class="flex space-x-2">
                            <button id="chart-toggle-hour" onclick="updateTrafficPeriod('hour')" class="px-2.5 py-1 text-xs font-mono rounded bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-medium">1 Hour</button>
                            <button id="chart-toggle-day" onclick="updateTrafficPeriod('day')" class="px-2.5 py-1 text-xs font-mono rounded text-gray-400 hover:bg-gray-800 transition-all">24 Hour</button>
                        </div>
                    </div>
                    <div class="h-64 relative">
                        <canvas id="trafficChart"></canvas>
                    </div>
                </div>

                <!-- Model Distribution -->
                <div class="glass-panel p-6 flex flex-col justify-between">
                    <div>
                        <h3 class="font-bold text-lg text-white mb-1">Model Distribution</h3>
                        <p class="text-xs text-gray-400 mb-6">Resource allocation inside local runtime</p>
                    </div>
                    <div class="h-44 relative flex items-center justify-center">
                        <canvas id="distributionChart"></canvas>
                    </div>
                    <div class="mt-4 border-t border-gray-800 pt-4 text-xs space-y-1.5 text-gray-400">
                        <div class="flex justify-between">
                            <span class="flex items-center"><span class="h-2 w-2 rounded-full bg-emerald-400 mr-2"></span>kenwell-core-v3</span>
                            <span class="font-mono text-white">45%</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="flex items-center"><span class="h-2 w-2 rounded-full bg-blue-400 mr-2"></span>kenwell-secure-token</span>
                            <span class="font-mono text-white">35%</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="flex items-center"><span class="h-2 w-2 rounded-full bg-teal-400 mr-2"></span>kenwell-vision</span>
                            <span class="font-mono text-white">20%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Roadmap and Security Blueprint Timeline -->
            <div class="glass-panel p-6">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h3 class="font-bold text-lg text-white">90-Day Enterprise Roadmap</h3>
                        <p class="text-xs text-gray-400">Core library features currently in production and deployment</p>
                    </div>
                    <div class="text-sm font-mono text-emerald-400 bg-emerald-950/40 border border-emerald-800/30 px-3 py-1 rounded-lg">
                        Phase 2 In-Progress
                    </div>
                </div>
                <div class="grid md:grid-cols-3 gap-6 relative">
                    <!-- Step 1 -->
                    <div class="relative bg-gray-950/40 border border-emerald-500/10 rounded-xl p-5">
                        <div class="absolute top-4 right-4 text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded text-[10px] font-mono border border-emerald-500/20">COMPLETED</div>
                        <span class="text-xs font-mono text-emerald-500 block mb-1">Days 1 - 30</span>
                        <h4 class="font-bold text-white mb-2">Token Management OS Integration</h4>
                        <p class="text-xs text-gray-400 leading-relaxed">Configuring secure physical layer hardware integration, AES token storage, and secure endpoints for library models.</p>
                    </div>
                    <!-- Step 2 -->
                    <div class="relative bg-gray-950/70 border border-emerald-500/30 rounded-xl p-5 glow-accent-green">
                        <div class="absolute top-4 right-4 text-teal-400 bg-teal-950 px-2 py-0.5 rounded text-[10px] font-mono border border-teal-500/20 animate-pulse">DEPLOYING</div>
                        <span class="text-xs font-mono text-teal-400 block mb-1">Days 31 - 60</span>
                        <h4 class="font-bold text-white mb-2">Localized AI Chatbot Suite</h4>
                        <p class="text-xs text-gray-400 leading-relaxed">Integration of the Kenwell-AI core assistant engine inside corporate intranets, bypassing public internet for extreme safety.</p>
                    </div>
                    <!-- Step 3 -->
                    <div class="relative bg-gray-950/20 border border-gray-800/60 rounded-xl p-5 opacity-60">
                        <span class="text-xs font-mono text-gray-500 block mb-1">Days 61 - 90</span>
                        <h4 class="font-bold text-white mb-2">Edge Device Distribution Blueprint</h4>
                        <p class="text-xs text-gray-400 leading-relaxed">Deploying optimized quantized weights to distributed edge servers and corporate IoT setups with unified key verification.</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- VIEW: PLAYGROUND -->
        <section id="view-playground" class="tab-view hidden space-y-6">
            <div class="grid lg:grid-cols-3 gap-6">
                <!-- Model Configuration Panel -->
                <div class="glass-panel p-6 flex flex-col justify-between">
                    <div class="space-y-6">
                        <div>
                            <h3 class="font-bold text-lg text-white flex items-center">
                                <i class="fa-solid fa-sliders text-emerald-400 mr-2"></i>Parameters
                            </h3>
                            <p class="text-xs text-gray-400">Tailor model architecture runtime settings</p>
                        </div>

                        <!-- Config fields -->
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-mono text-gray-400 mb-1.5">Model Family</label>
                                <select id="playground-model" class="w-full bg-gray-950 border border-gray-800 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm rounded-lg p-2.5 outline-none font-mono">
                                    <option value="kenwell-core-v3">kenwell-core-v3.0b (Dynamic)</option>
                                    <option value="kenwell-secure-token">kenwell-token-guard-v1.4</option>
                                    <option value="kenwell-vision-v2">kenwell-vision-v2.1-ocr</option>
                                </select>
                            </div>

                            <div>
                                <div class="flex justify-between items-center mb-1.5">
                                    <label class="block text-xs font-mono text-gray-400">Temperature</label>
                                    <span id="temp-val" class="text-xs font-mono text-emerald-400">0.7</span>
                                </div>
                                <input type="range" id="param-temp" min="0" max="1.5" step="0.1" value="0.7" oninput="document.getElementById('temp-val').innerText = this.value" class="w-full h-1 bg-gray-800 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                            </div>

                            <div>
                                <div class="flex justify-between items-center mb-1.5">
                                    <label class="block text-xs font-mono text-gray-400">Max Tokens</label>
                                    <span id="tokens-val" class="text-xs font-mono text-emerald-400">1024</span>
                                </div>
                                <input type="range" id="param-tokens" min="256" max="4096" step="256" value="1024" oninput="document.getElementById('tokens-val').innerText = this.value" class="w-full h-1 bg-gray-800 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                            </div>

                            <div>
                                <label class="block text-xs font-mono text-gray-400 mb-1.5">System Instruction Preset</label>
                                <textarea id="system-prompt" class="w-full h-24 bg-gray-950 border border-gray-800 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-xs rounded-lg p-2.5 outline-none" placeholder="Enter custom agent directives...">You are Kenwell-AI, an enterprise-grade AI assistant optimized for token security, database integrity, and high-performance server integrations.</textarea>
                            </div>
                        </div>
                    </div>

                    <div class="pt-6 border-t border-gray-800 mt-6 space-y-2">
                        <button onclick="resetPlayground()" class="w-full bg-gray-800 hover:bg-gray-700 text-white py-2 rounded-lg font-medium text-xs transition-all">
                            Reset Session Settings
                        </button>
                    </div>
                </div>

                <!-- Chat Canvas Playground -->
                <div class="lg:col-span-2 glass-panel p-6 flex flex-col justify-between h-[600px]">
                    <!-- Canvas Header -->
                    <div class="border-b border-gray-800 pb-4 flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <span class="relative flex h-2 w-2">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-teal-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2 w-2 bg-teal-500"></span>
                            </span>
                            <span class="text-sm font-bold text-white">Active Stream Target: Local Host (8080)</span>
                        </div>
                        <button onclick="clearChat()" class="text-xs text-gray-400 hover:text-rose-400 transition-all flex items-center space-x-1">
                            <i class="fa-solid fa-trash-can"></i>
                            <span>Clear Conversation</span>
                        </button>
                    </div>

                    <!-- Chat Message Area -->
                    <div id="chat-messages" class="flex-grow my-4 overflow-y-auto space-y-4 pr-1">
                        <!-- Welcome message -->
                        <div class="bg-emerald-950/20 border border-emerald-500/10 rounded-xl p-4 flex gap-3">
                            <div class="h-8 w-8 rounded bg-gradient-to-tr from-emerald-500 to-teal-400 text-gray-950 flex items-center justify-center font-bold text-sm shrink-0 shadow-sm">
                                <i class="fa-solid fa-robot"></i>
                            </div>
                            <div>
                                <span class="text-xs font-mono font-bold text-emerald-400">KENWELL-AI CONSOLE</span>
                                <p class="text-sm text-gray-300 mt-1 leading-relaxed">
                                    Kenwell AI engine online. I can assist with building Python wrappers, formulating secure cryptography scripts, executing token rotation models, or answering questions on Kenwell database operations. Ask me anything!
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- Interactive Inputs -->
                    <div class="border-t border-gray-800 pt-4">
                        <form id="chat-form" onsubmit="handleChatSubmit(event)" class="relative flex items-center">
                            <input type="text" id="chat-input" class="w-full bg-gray-950 border border-gray-800 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm rounded-lg pl-4 pr-12 py-3.5 outline-none text-white" placeholder="Type instructions or query (e.g. 'how to rotate Kenwell token?')...">
                            <button type="submit" class="absolute right-2 bg-emerald-500 text-gray-950 hover:bg-emerald-400 transition-all w-9 h-9 rounded-md flex items-center justify-center shadow-lg">
                                <i class="fa-solid fa-paper-plane text-sm"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- VIEW: SECURITY KEYS -->
        <section id="view-keys" class="tab-view hidden space-y-6">
            <div class="grid lg:grid-cols-3 gap-6">
                <!-- Create/Generate Key Panel -->
                <div class="glass-panel p-6">
                    <h3 class="font-bold text-lg text-white mb-2 flex items-center">
                        <i class="fa-solid fa-shield-halved text-emerald-400 mr-2"></i>Generate Security Token
                    </h3>
                    <p class="text-xs text-gray-400 mb-6">Create scoped security credentials for localized application execution.</p>

                    <form id="token-form" onsubmit="generateKey(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-mono text-gray-400 mb-1.5">Application Name</label>
                            <input type="text" id="token-name" required class="w-full bg-gray-950 border border-gray-800 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm rounded-lg p-2.5 outline-none text-white" placeholder="e.g. billing-microservice">
                        </div>
                        <div>
                            <label class="block text-xs font-mono text-gray-400 mb-1.5">Scope Permission</label>
                            <select id="token-scope" class="w-full bg-gray-950 border border-gray-800 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm rounded-lg p-2.5 outline-none font-mono">
                                <option value="read-only">read:token - Read Only (Safe)</option>
                                <option value="read-write">write:token - Database Interfacing</option>
                                <option value="admin">admin:token - Fully Authorized Root</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-gray-950 font-bold py-2.5 rounded-lg hover:from-emerald-400 hover:to-teal-400 transition-all shadow-md">
                            Generate New Token Key
                        </button>
                    </form>
                </div>

                <!-- Active Credentials List -->
                <div class="lg:col-span-2 glass-panel p-6">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h3 class="font-bold text-lg text-white">Active Scoped API Keys</h3>
                            <p class="text-xs text-gray-400">Keys registered for localized server authorization</p>
                        </div>
                        <span class="text-[10px] bg-red-950/40 border border-red-800/30 text-rose-400 px-2 py-1 rounded font-mono">
                            Auto-rotates in 90 Days
                        </span>
                    </div>

                    <div class="overflow-x-auto w-full">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead>
                                <tr class="border-b border-gray-800 text-gray-400 font-mono text-xs">
                                    <th class="pb-3 font-semibold">Label</th>
                                    <th class="pb-3 font-semibold">Scope</th>
                                    <th class="pb-3 font-semibold">Secret Key Mapping</th>
                                    <th class="pb-3 font-semibold text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="keys-table-body" class="divide-y divide-gray-800/50">
                                <!-- Default keys populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <!-- VIEW: API DOCS -->
        <section id="view-docs" class="tab-view hidden space-y-6">
            <div class="grid lg:grid-cols-4 gap-6">
                <!-- Sidebar Nav inside Docs -->
                <div class="glass-panel p-4 h-fit">
                    <span class="text-xs font-mono text-emerald-400 block mb-3 uppercase tracking-wider pl-2">SDK Endpoints</span>
                    <nav class="space-y-1">
                        <button onclick="switchDocSnippet('python')" id="doc-btn-python" class="w-full text-left px-3 py-2 rounded-lg text-xs font-mono bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 transition-all flex items-center">
                            <i class="fa-brands fa-python text-sm mr-2.5"></i>python-sdk wrapper
                        </button>
                        <button onclick="switchDocSnippet('nodejs')" id="doc-btn-nodejs" class="w-full text-left px-3 py-2 rounded-lg text-xs font-mono text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all flex items-center">
                            <i class="fa-brands fa-node-js text-sm mr-2.5"></i>node-sdk library
                        </button>
                        <button onclick="switchDocSnippet('curl')" id="doc-btn-curl" class="w-full text-left px-3 py-2 rounded-lg text-xs font-mono text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all flex items-center">
                            <i class="fa-solid fa-terminal text-sm mr-2.5"></i>direct cURL request
                        </button>
                    </nav>
                </div>

                <!-- API Content Body -->
                <div class="lg:col-span-3 glass-panel p-6 space-y-6">
                    <div>
                        <h2 class="text-2xl font-bold text-white mb-2">Connecting to Kenwell-AI</h2>
                        <p class="text-sm text-gray-400 leading-relaxed">
                            To query the active local server instance, pass your verified scope token in the authorization header. Below are templates that run perfectly out-of-the-box.
                        </p>
                    </div>

                    <!-- Code Box Header -->
                    <div class="bg-gray-950 rounded-xl overflow-hidden border border-gray-800">
                        <div class="bg-gray-900 px-4 py-2 flex justify-between items-center border-b border-gray-800">
                            <span id="code-box-title" class="text-xs font-mono text-emerald-400">main.py</span>
                            <button onclick="copyCodeSnippet()" class="text-xs text-gray-400 hover:text-white flex items-center space-x-1 font-mono transition-all">
                                <i class="fa-solid fa-clone"></i>
                                <span>Copy Code</span>
                            </button>
                        </div>
                        
                        <!-- Snippet View containers -->
                        <div class="p-4 text-xs overflow-x-auto code-font leading-relaxed">
                            <pre id="snippet-python" class="text-teal-300">import kenwell_ai as kw

# Initialize connection mapping to local hardware engine
client = kw.KenwellClient(
    api_key="kw_key_secure_xxxxxxxxxx",
    base_url="http://localhost:8080/v1"
)

# Stream completion weights dynamically
response = client.completions.create(
    model="kenwell-core-v3",
    prompt="Design a secure token rotation script",
    temperature=0.7,
    max_tokens=1024
)

print(response.choices[0].text)</pre>

                            <pre id="snippet-nodejs" class="hidden text-emerald-300">const KenwellAI = require('kenwell-ai-node');

// Instantiation of the Kenwell client
const client = new KenwellAI({
    apiKey: 'kw_key_secure_xxxxxxxxxx',
    endpoint: 'http://localhost:8080/v1'
});

async function requestCompletion() {
    const stream = await client.completions.create({
        model: 'kenwell-core-v3',
        prompt: 'Secure validation blueprint guidelines',
        maxTokens: 512
    });
    console.log(stream.text);
}

requestCompletion();</pre>

                            <pre id="snippet-curl" class="hidden text-amber-300">curl -X POST http://localhost:8080/v1/completions \
  -H "Authorization: Bearer kw_key_secure_xxxxxxxxxx" \
  -H "Content-Type: application/json" \
  -d '{
    "model": "kenwell-core-v3",
    "prompt": "Run database integrity validation mapping",
    "temperature": 0.5,
    "max_tokens": 512
  }'</pre>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="mt-8 border-t border-gray-900 py-6 text-center text-xs text-gray-500 font-mono">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                © 2026 Kenwell IT Solutions Inc. All rights reserved.
            </div>
            <div class="flex space-x-4">
                <a href="https://kenwellitsolutions.com/" target="_blank" class="hover:text-emerald-400 transition-all">Official Site</a>
                <span>•</span>
                <span class="text-teal-500"><i class="fa-solid fa-lock mr-1"></i>Token OS Secured</span>
            </div>
        </div>
    </footer>

    <script>
        // State variables
        let activeTab = 'dashboard';
        let trafficChart = null;
        let distributionChart = null;
        let selectedDocLanguage = 'python';

        // Fake database of initial active keys
        let activeKeys = [
            { id: 'kw-1', label: 'prod-webserver-auth', scope: 'admin:token', key: 'kw_key_secure_a982fd...f03', created: '2026-04-10' },
            { id: 'kw-2', label: 'chatbot-widget-client', scope: 'read:token', key: 'kw_key_secure_88cd20...e92', created: '2026-05-12' }
        ];

        // Mock chat model logic
        const AIResponses = {
            "token": "Under the Kenwell Blueprint, security tokens are mapped directly using SHA-256 HSM architecture. Ensure your rotations run automatically every 90 days. For dynamic configurations, see the 'Token Security' tab.",
            "hello": "Hello! I am Kenwell-AI, how can I assist you with your library configuration or deployment roadmap today?",
            "rotate": "To rotate a Kenwell key programmatically, issue a PATCH call directly to the `/v1/keys/rotate` endpoint with your admin token in the payload.",
            "database": "The database core runs localized SQLite/Postgres configurations. Always map indices utilizing in-memory Redis layer for the fast sub-20ms latency responses.",
            "default": "The local Kenwell-AI engine processes queries efficiently. Try asking about 'security token models' or 'database latency optimizations'."
        };

        // Initialize script operations on load
        window.onload = function () {
            initAnalytics();
            renderKeys();
        };

        function switchTab(tabId) {
            // Hide all tab views
            document.querySelectorAll('.tab-view').forEach(view => view.classList.add('hidden'));
            
            // Remove active classes from navigation buttons
            const navButtons = [
                { id: 'nav-dashboard', key: 'dashboard' },
                { id: 'nav-playground', key: 'playground' },
                { id: 'nav-keys', key: 'keys' },
                { id: 'nav-docs', key: 'docs' }
            ];

            navButtons.forEach(btnObj => {
                const btn = document.getElementById(btnObj.id);
                if (btnObj.key === tabId) {
                    btn.className = "px-4 py-2 rounded-lg bg-gray-800 text-emerald-400 border border-emerald-500/20 transition-all";
                } else {
                    btn.className = "px-4 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all";
                }
            });

            // Show current view
            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            activeTab = tabId;

            // Retrigger resize or render if required
            if (tabId === 'dashboard') {
                setTimeout(() => {
                    trafficChart.resize();
                    distributionChart.resize();
                }, 50);
            }
        }

        function initAnalytics() {
            // Traffic Chart Setup
            const trafficCtx = document.getElementById('trafficChart').getContext('2d');
            trafficChart = new Chart(trafficCtx, {
                type: 'line',
                data: {
                    labels: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00'],
                    datasets: [
                        {
                            label: 'API Core Calls',
                            data: [15, 22, 65, 85, 40, 55],
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.05)',
                            fill: true,
                            tension: 0.35,
                            borderWidth: 2
                        },
                        {
                            label: 'Security Check Routine',
                            data: [30, 30, 45, 50, 35, 40],
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.02)',
                            fill: true,
                            tension: 0.35,
                            borderWidth: 1.5,
                            borderDash: [5, 5]
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: { color: '#9ca3af', font: { family: 'Fira Code', size: 10 } }
                        }
                    },
                    scales: {
                        y: {
                            grid: { color: 'rgba(75, 85, 99, 0.15)' },
                            ticks: { color: '#6b7280' }
                        },
                        x: {
                            grid: { color: 'rgba(75, 85, 99, 0.15)' },
                            ticks: { color: '#6b7280' }
                        }
                    }
                }
            });

            // Model Distribution Chart
            const distCtx = document.getElementById('distributionChart').getContext('2d');
            distributionChart = new Chart(distCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Core-v3', 'Secure-token', 'Vision-v2'],
                    datasets: [{
                        data: [45, 35, 20],
                        backgroundColor: ['#10b981', '#3b82f6', '#14b8a6'],
                        hoverOffset: 4,
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    cutout: '75%'
                }
            });
        }

        // Change analytics dataset based on button trigger
        function updateTrafficPeriod(period) {
            const btnHour = document.getElementById('chart-toggle-hour');
            const btnDay = document.getElementById('chart-toggle-day');

            if (period === 'hour') {
                btnHour.className = "px-2.5 py-1 text-xs font-mono rounded bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-medium";
                btnDay.className = "px-2.5 py-1 text-xs font-mono rounded text-gray-400 hover:bg-gray-800 transition-all";
                trafficChart.data.labels = ['10m ago', '8m ago', '6m ago', '4m ago', '2m ago', 'Just Now'];
                trafficChart.data.datasets[0].data = [42, 58, 62, 80, 71, 95];
                trafficChart.data.datasets[1].data = [20, 25, 32, 28, 40, 38];
            } else {
                btnDay.className = "px-2.5 py-1 text-xs font-mono rounded bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-medium";
                btnHour.className = "px-2.5 py-1 text-xs font-mono rounded text-gray-400 hover:bg-gray-800 transition-all";
                trafficChart.data.labels = ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00'];
                trafficChart.data.datasets[0].data = [15, 22, 65, 85, 40, 55];
                trafficChart.data.datasets[1].data = [30, 30, 45, 50, 35, 40];
            }
            trafficChart.update();
            triggerNotification('Analytics update fetched successfully.');
        }

        function handleChatSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const messageText = input.value.trim();
            if (!messageText) return;

            // Render User message
            appendChatMessage('USER', messageText);
            input.value = '';

            // Loading state indicator simulation
            const loaderId = appendLoadingIndicator();

            setTimeout(() => {
                removeLoadingIndicator(loaderId);
                
                // Match key phrases from prompt
                const lowerText = messageText.toLowerCase();
                let matchedResponse = AIResponses.default;
                
                if (lowerText.includes('token') || lowerText.includes('security')) {
                    matchedResponse = AIResponses.token;
                } else if (lowerText.includes('rotate')) {
                    matchedResponse = AIResponses.rotate;
                } else if (lowerText.includes('database')) {
                    matchedResponse = AIResponses.database;
                } else if (lowerText.includes('hello') || lowerText.includes('hi')) {
                    matchedResponse = AIResponses.hello;
                }

                appendChatMessage('KENWELL-AI CONSOLE', matchedResponse);
            }, 900);
        }

        function appendChatMessage(sender, text) {
            const container = document.getElementById('chat-messages');
            const isAI = sender !== 'USER';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = isAI 
                ? 'bg-emerald-950/20 border border-emerald-500/10 rounded-xl p-4 flex gap-3'
                : 'bg-gray-900 border border-gray-800 rounded-xl p-4 flex gap-3 flex-row-reverse';

            const iconMarkup = isAI
                ? `<div class="h-8 w-8 rounded bg-gradient-to-tr from-emerald-500 to-teal-400 text-gray-950 flex items-center justify-center font-bold text-sm shrink-0 shadow-sm"><i class="fa-solid fa-robot"></i></div>`
                : `<div class="h-8 w-8 rounded bg-gray-800 text-emerald-400 flex items-center justify-center font-bold text-sm shrink-0 border border-gray-700"><i class="fa-solid fa-user"></i></div>`;

            const alignmentClass = isAI ? 'text-left' : 'text-right';
            const senderClass = isAI ? 'text-emerald-400' : 'text-gray-400';

            messageDiv.innerHTML = `
                ${iconMarkup}
                <div class="${alignmentClass} w-full">
                    <span class="text-xs font-mono font-bold ${senderClass}">${sender}</span>
                    <p class="text-sm text-gray-300 mt-1 leading-relaxed">${text}</p>
                </div>
            `;
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function appendLoadingIndicator() {
            const container = document.getElementById('chat-messages');
            const loaderId = 'loader-' + Date.now();
            const loaderDiv = document.createElement('div');
            loaderDiv.id = loaderId;
            loaderDiv.className = 'bg-emerald-950/10 border border-emerald-500/5 rounded-xl p-4 flex gap-3';
            loaderDiv.innerHTML = `
                <div class="h-8 w-8 rounded bg-emerald-500/10 text-emerald-400 flex items-center justify-center font-bold text-sm shrink-0 animate-pulse"><i class="fa-solid fa-hourglass"></i></div>
                <div>
                    <span class="text-xs font-mono font-bold text-emerald-500/70">Thinking...</span>
                    <p class="text-sm text-gray-500 mt-1">Generating completion weights from core...</p>
                </div>
            `;
            container.appendChild(loaderDiv);
            container.scrollTop = container.scrollHeight;
            return loaderId;
        }

        function removeLoadingIndicator(id) {
            const element = document.getElementById(id);
            if (element) element.remove();
        }

        function clearChat() {
            document.getElementById('chat-messages').innerHTML = '';
            appendChatMessage('KENWELL-AI CONSOLE', 'Chat logs cleared. System is idle.');
            triggerNotification('Playground logs purged.');
        }

        function resetPlayground() {
            document.getElementById('param-temp').value = 0.7;
            document.getElementById('temp-val').innerText = '0.7';
            document.getElementById('param-tokens').value = 1024;
            document.getElementById('tokens-val').innerText = '1024';
            document.getElementById('system-prompt').value = "You are Kenwell-AI, an enterprise-grade AI assistant optimized for token security, database integrity, and high-performance server integrations.";
            triggerNotification('Playground defaults restored.');
        }

        function renderKeys() {
            const tbody = document.getElementById('keys-table-body');
            tbody.innerHTML = '';

            activeKeys.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-800/40 text-gray-300 hover:bg-gray-900/10 transition-colors";
                tr.innerHTML = `
                    <td class="py-4 font-mono font-medium text-white">${item.label}</td>
                    <td class="py-4 font-mono text-xs"><span class="bg-gray-800 px-2 py-0.5 rounded border border-gray-700 text-gray-300">${item.scope}</span></td>
                    <td class="py-4 font-mono text-xs text-gray-400">${item.key}</td>
                    <td class="py-4 text-right">
                        <button onclick="revokeKey('${item.id}')" class="text-xs bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white px-2.5 py-1 rounded transition-all">
                            Revoke
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function generateKey(e) {
            e.preventDefault();
            const labelInput = document.getElementById('token-name');
            const scopeSelect = document.getElementById('token-scope');

            const newId = 'kw-' + (activeKeys.length + 1);
            const randomHex = Math.random().toString(16).substring(2, 8) + '...' + Math.random().toString(16).substring(2, 5);
            const formattedKey = `kw_key_${scopeSelect.value.split(':')[0]}_${randomHex}`;
            
            const newKey = {
                id: newId,
                label: labelInput.value.trim(),
                scope: scopeSelect.value,
                key: formattedKey,
                created: new Date().toISOString().split('T')[0]
            };

            activeKeys.push(newKey);
            renderKeys();
            
            labelInput.value = '';
            triggerNotification('A security token was generated successfully!');
        }

        function revokeKey(id) {
            activeKeys = activeKeys.filter(item => item.id !== id);
            renderKeys();
            triggerNotification('Security token revoked immediately.', 'warning');
        }

        function switchDocSnippet(lang) {
            const languages = ['python', 'nodejs', 'curl'];
            languages.forEach(l => {
                const element = document.getElementById(`snippet-${l}`);
                const btn = document.getElementById(`doc-btn-${l}`);
                
                if (l === lang) {
                    element.classList.remove('hidden');
                    btn.className = "w-full text-left px-3 py-2 rounded-lg text-xs font-mono bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 transition-all flex items-center";
                } else {
                    element.classList.add('hidden');
                    btn.className = "w-full text-left px-3 py-2 rounded-lg text-xs font-mono text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all flex items-center";
                }
            });

            const codeTitle = document.getElementById('code-box-title');
            if (lang === 'python') codeTitle.innerText = 'main.py';
            else if (lang === 'nodejs') codeTitle.innerText = 'index.js';
            else codeTitle.innerText = 'request.sh';

            selectedDocLanguage = lang;
        }

        function copyCodeSnippet() {
            const element = document.getElementById(`snippet-${selectedDocLanguage}`);
            const tempTextarea = document.createElement('textarea');
            tempTextarea.value = element.innerText;
            document.body.appendChild(tempTextarea);
            tempTextarea.select();
            document.execCommand('copy');
            document.body.removeChild(tempTextarea);

            triggerNotification(`Copied ${selectedDocLanguage} snippet to clipboard.`);
        }

        // Custom notification toaster helper
        function triggerNotification(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = message;
            
            if (type === 'warning') {
                toast.className = "fixed bottom-6 right-6 z-50 transform translate-y-0 opacity-100 transition-all duration-300 flex items-center p-4 space-x-3 max-w-sm rounded-lg shadow-xl text-white bg-gray-900 border border-rose-500/40";
                toastIcon.className = "fa-solid fa-triangle-exclamation text-rose-400";
            } else {
                toast.className = "fixed bottom-6 right-6 z-50 transform translate-y-0 opacity-100 transition-all duration-300 flex items-center p-4 space-x-3 max-w-sm rounded-lg shadow-xl text-white bg-gray-900 border border-emerald-500/30";
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            }

            // Hide after delay
            setTimeout(() => {
                toast.className = "fixed bottom-6 right-6 z-50 transform translate-y-10 opacity-0 transition-all duration-300 flex items-center p-4 space-x-3 max-w-sm rounded-lg shadow-xl text-white bg-gray-900 border border-transparent";
            }, 3000);
        }
    </script>
</body>
</html>
